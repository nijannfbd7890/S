<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Performance Dashboard</title>

    <!-- Bootstrap -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

    <!-- DataTables -->
    <link rel="stylesheet"
          href="https://cdn.datatables.net/1.13.4/css/dataTables.bootstrap5.min.css">

    <style>
        body { background:#f5f7fa; padding:20px; }
        .card { border-radius:12px; box-shadow:0 2px 6px rgba(0,0,0,0.08); }
        .dashboard-title { font-size:28px; font-weight:bold; margin-bottom:20px; }
        table.dataTable th { background:#e1e7ef; }
    </style>
</head>
<body>

<div class="container">
    <div class="dashboard-title">📊 Performance Dashboard</div>

    <!-- Data Table -->
    <div class="card p-4 mb-4">
        <h4>Overall Summary Table</h4>
        <table id="summary" class="table table-striped" style="width:100%">
            <thead></thead>
            <tbody></tbody>
        </table>
    </div>

    <!-- Charts -->
    <div class="row">
        <div class="col-md-6">
            <div class="card p-4 mb-4">
                <h5>Cash vs Loan Count</h5>
                <canvas id="countChart"></canvas>
            </div>
        </div>
        <div class="col-md-6">
            <div class="card p-4 mb-4">
                <h5>Total SQ-FT by Year</h5>
                <canvas id="sqftChart"></canvas>
            </div>
        </div>
    </div>

</div>

<!-- JS Libraries -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.3.2/papaparse.min.js"></script>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.datatables.net/1.13.4/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/1.13.4/js/dataTables.bootstrap5.min.js"></script>

<script>
// Load CSV from GitHub
Papa.parse("https://nijannfbd7890.github.io/S/Overall.csv", {
    download: true,
    header: true,
    dynamicTyping: true,
    complete: function(results) {

        const data = results.data;

        // Build table headers
        const columns = Object.keys(data[0]);
        let thead = "<tr>";
        columns.forEach(c => { thead += `<th>${c}</th>`; });
        thead += "</tr>";
        document.querySelector("#summary thead").innerHTML = thead;

        // Build table rows
        let tbody = "";
        data.forEach(row => {
            tbody += "<tr>";
            columns.forEach(c => tbody += `<td>${row[c]}</td>`);
            tbody += "</tr>";
        });
        document.querySelector("#summary tbody").innerHTML = tbody;

        // Activate DataTable
        $('#summary').DataTable();

        // Extract Chart Data
        const years = data.map(r => r['Row Labels']);
        const cashCount = data.map(r => r['Cash Count']);
        const loanCount = data.map(r => r['Loan Count']);
        const totalSqft = data.map(r => r['Total SQ-FT']);

        // CHART 1 - Cash vs Loan Count
        new Chart(document.getElementById('countChart'), {
            type: 'bar',
            data: {
                labels: years,
                datasets: [
                    { label: "Cash Count", data: cashCount },
                    { label: "Loan Count", data: loanCount }
                ]
            }
        });

        // CHART 2 - Total SQ-FT by Year
        new Chart(document.getElementById('sqftChart'), {
            type: 'line',
            data: {
                labels: years,
                datasets: [
                    { label: "Total SQ-FT", data: totalSqft }
                ]
            }
        });
    }
});
</script>

</body>
</html>
