<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Company Performance Dashboard</title>

<!-- Bootstrap -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

<!-- DataTables -->
<link rel="stylesheet" href="https://cdn.datatables.net/1.13.4/css/dataTables.bootstrap5.min.css">

<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<!-- PapaParse -->
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.3.2/papaparse.min.js"></script>

<style>
body { background: #eef2f7; }
.card { border-radius: 14px; }
.kpi-card { text-align: center; padding: 20px; border-radius: 16px; }
.kpi-number { font-size: 32px; font-weight: 700; }
.kpi-title { color: #666; font-size: 15px; }
h2 { font-weight: 700; }
</style>
</head>

<body class="p-4">

<div class="container-fluid">

    <h2 class="text-center mb-4">📊 Company Performance Dashboard</h2>

    <!-- Filter Row -->
    <div class="row mb-4">
        <div class="col-md-4">
            <label class="form-label fw-bold">Filter by Year</label>
            <select id="yearFilter" class="form-select">
                <option value="">All Years</option>
            </select>
        </div>
        <div class="col-md-4">
            <label class="form-label fw-bold">Filter by Team</label>
            <select id="teamFilter" class="form-select">
                <option value="">All Teams</option>
            </select>
        </div>
        <div class="col-md-4">
            <label class="form-label fw-bold">Filter by Staff</label>
            <select id="staffFilter" class="form-select">
                <option value="">All Staff</option>
            </select>
        </div>
    </div>

    <!-- KPI Cards -->
    <div class="row mb-4 text-center" id="kpiContainer"></div>

    <!-- Charts -->
    <div class="row mb-4">
        <div class="col-md-6">
            <div class="card shadow p-3">
                <canvas id="yearTrendChart"></canvas>
            </div>
        </div>
        <div class="col-md-6">
            <div class="card shadow p-3">
                <canvas id="teamBarChart"></canvas>
            </div>
        </div>
    </div>

    <!-- Table -->
    <div class="card shadow p-3 mt-3">
        <table id="dataTable" class="table table-striped table-bordered"></table>
    </div>

</div>

<!-- DataTables -->
<script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
<script src="https://cdn.datatables.net/1.13.4/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/1.13.4/js/dataTables.bootstrap5.min.js"></script>

<script>
let rawData = [];
let filteredData = [];

let dataTable = null;
let yearChart = null;
let teamChart = null;

// CSV location
const csvURL = "https://nijannfbd7890.github.io/S/Pivot.csv";

// Load CSV automatically
Papa.parse(csvURL, {
    download: true,
    header: true,
    dynamicTyping: true,
    complete: function (results) {
        rawData = results.data.filter(r => r["Year"]);
        populateFilters();
        applyFilters();
    }
});

function populateFilters() {
    let years = [...new Set(rawData.map(r => r.Year))].sort();
    let teams = [...new Set(rawData.map(r => r[" TEAM NAME"]))].sort();
    let staff = [...new Set(rawData.map(r => r["staff name"]))].sort();

    years.forEach(y => yearFilter.innerHTML += `<option value="${y}">${y}</option>`);
    teams.forEach(t => teamFilter.innerHTML += `<option>${t}</option>`);
    staff.forEach(s => staffFilter.innerHTML += `<option>${s}</option>`);
}

document.getElementById("yearFilter").onchange =
document.getElementById("teamFilter").onchange =
document.getElementById("staffFilter").onchange = applyFilters;

function applyFilters() {
    let yf = yearFilter.value;
    let tf = teamFilter.value;
    let sf = staffFilter.value;

    filteredData = rawData.filter(r =>
        (yf === "" || r.Year == yf) &&
        (tf === "" || r[" TEAM NAME"] === tf) &&
        (sf === "" || r["staff name"] === sf)
    );

    updateKPI();
    updateCharts();
    updateTable();
}

function updateKPI() {
    let plots = filteredData.reduce((a, b) => a + (Number(b["NO OF PLOTS"]) || 0), 0);
    let sqft = filteredData.reduce((a, b) => a + (Number(b["Actual TOTAL SQ-FT"]) || 0), 0);
    let amount = filteredData.reduce((a, b) => a + (Number(b["Commited Amount "]) || 0), 0);

    document.getElementById("kpiContainer").innerHTML = `
        <div class="col-md-4">
            <div class="card kpi-card shadow">
                <div class="kpi-title">Total Plots</div>
                <div class="kpi-number">${plots}</div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card kpi-card shadow">
                <div class="kpi-title">Total Sq-ft</div>
                <div class="kpi-number">${sqft.toLocaleString()}</div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card kpi-card shadow">
                <div class="kpi-title">Committed Amount</div>
                <div class="kpi-number">₹ ${amount.toLocaleString()}</div>
            </div>
        </div>
    `;
}

function updateCharts() {
    // YEAR TREND
    let yearly = {};
    filteredData.forEach(r => {
        yearly[r.Year] = (yearly[r.Year] || 0) + (Number(r["NO OF PLOTS"]) || 0);
    });

    if (yearChart) yearChart.destroy();
    yearChart = new Chart(document.getElementById("yearTrendChart"), {
        type: "line",
        data: {
            labels: Object.keys(yearly),
            datasets: [{
                label: "Plots per Year",
                data: Object.values(yearly),
                borderWidth: 3,
                pointRadius: 4
            }]
        }
    });

    // TEAM BAR CHART
    let teamCounts = {};
    filteredData.forEach(r => {
        let t = r[" TEAM NAME"];
        teamCounts[t] = (teamCounts[t] || 0) + (Number(r["NO OF PLOTS"]) || 0);
    });

    if (teamChart) teamChart.destroy();
    teamChart = new Chart(document.getElementById("teamBarChart"), {
        type: "bar",
        data: {
            labels: Object.keys(teamCounts),
            datasets: [{
                label: "Plots by Team",
                data: Object.values(teamCounts)
            }]
        }
    });
}

function updateTable() {
    if (dataTable) dataTable.destroy();

    const cols = Object.keys(filteredData[0] || {}).map(c => ({
        data: c, title: c
    }));

    dataTable = $("#dataTable").DataTable({
        data: filteredData,
        columns: cols,
        pageLength: 10
    });
}
</script>

</body>
</html>
